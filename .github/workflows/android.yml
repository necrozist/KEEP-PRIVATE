name: android-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept licenses and install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;23.1.7779620" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: apps/multiplatform
        run: ./gradlew assembleFossDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/multiplatform/android/build/outputs/apk/**/*.apk
